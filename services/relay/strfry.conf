##
## strfry 1.1.3 configuration for a flexmydomain relay.
##
## Based on strfry's own default config for 1.1.3; only the values marked
## "flexmydomain:" differ from it. Values that depend on where the relay is
## deployed (its public URL, its name, the operator's key) are not in this
## file: entrypoint.sh passes them with --set from the environment (.env).
##

db = "/app/strfry-db/"

dbParams {
    maxreaders = 256
    # Virtual address space for the LMDB map, not disk use.
    mapsize = 10995116277760
    noReadAhead = false
}

events {
    maxEventSize = 65536
    rejectEventsNewerThanSeconds = 900
    rejectEventsOlderThanSeconds = 94608000
    rejectEphemeralEventsOlderThanSeconds = 60
    ephemeralEventsLifetimeSeconds = 300
    maxNumTags = 2000
    maxTagValSize = 1024
}

relay {
    # flexmydomain: listen inside the container. Only Caddy reaches this port;
    # docker-compose.yml does not publish it to the host.
    bind = "0.0.0.0"
    port = 7777

    # flexmydomain: the container's nofile limit is set in docker-compose.yml.
    nofiles = 0

    # flexmydomain: Caddy terminates TLS and forwards the client address here.
    # The write policy rate-limits by it, so it must be the real client.
    realIpHeader = "x-forwarded-for"

    auth {
        enabled = true
        # Set at start-up from RELAY_URL (entrypoint.sh).
        serviceUrl = ""
    }

    info {
        # name, description, pubkey and contact are set from .env at start-up.
        name = "flexmydomain"
        description = "Stores flexmydomain events only."
        pubkey = ""
        self = ""
        contact = ""
        icon = ""
        banner = ""
        privacy = ""
        terms = ""
        # flexmydomain: the NIPs this relay honours. strfry's default list
        # also names NIP-02, 04 and 28, whose kinds the write policy refuses,
        # and a client that trusts NIP-11 would be misled by them.
        nips = "[1,9,11,40,42,45,70,77]"
    }

    maxWebsocketPayloadSize = 131072
    maxReqFilterSize = 200
    autoPingSeconds = 55
    enableTcpKeepalive = false
    queryTimesliceBudgetMicroseconds = 10000
    maxFilterLimit = 500

    # NIP-45. The market's listing total and TLD facets are COUNTs.
    maxFilterLimitCount = 1000000

    # flexmydomain: down from 200. The pages open a handful of subscriptions
    # each, and the extra room would only serve abuse.
    maxSubsPerConnection = 50

    writePolicy {
        # flexmydomain: services/relay/write-policy.ts, compiled into the image.
        plugin = "/app/fmd-write-policy"
        timeoutSeconds = 10
    }

    compression {
        enabled = true
        slidingWindow = true
    }

    logging {
        dumpInAll = false
        dumpInEvents = false
        dumpInReqs = false
        dbScanPerf = false
        invalidEvents = true
    }

    numThreads {
        ingester = 3
        reqWorker = 3
        reqMonitor = 3
        negentropy = 2
    }

    negentropy {
        # Lets anyone mirror this relay efficiently with strfry sync. The data
        # here is public, and the relay must be disposable.
        enabled = true
        maxSyncEvents = 1000000
    }

    filterValidation {
        enabled = false
        maxFiltersPerReq = 3
        minFiltersPerReq = 1
        maxKindsPerFilter = 3
        allowedKinds = ""
        requireAuthorOrTag = false
    }
}
